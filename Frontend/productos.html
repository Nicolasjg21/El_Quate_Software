<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Productos - El Cuate</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div class="contenedor">

  <div class="menu">
    <div class="marca-menu">
      <img src="img/logo-menu.png" alt="El Cuate">
      <div>
        <h2>El Cuate</h2>
        <p class="submarca">Sistema POS</p>
      </div>
    </div>
    <div class="menu__enlaces">
      <a href="inicio.html"><span class="icono-menu">🏠</span>Panel Principal</a>
      <a href="mesas.html"><span class="icono-menu">🍽️</span>Mesas</a>
      <a href="reportes.html"><span class="icono-menu">📊</span>Ventas y Analíticas</a>
      <a href="productos.html" class="activo"><span class="icono-menu">📦</span>Inventario</a>
      <a href="historiales.html"><span class="icono-menu">🧾</span>Historiales</a>
      <a href="auditoria.html"><span class="icono-menu">🕘</span>Auditoría</a>
      <a href="usuarios.html"><span class="icono-menu">👥</span>Usuarios</a>
    </div>
    <div class="menu__pie">
      <a href="configuracion.html"><span class="icono-menu">⚙️</span>Configuración</a>
      <a href="#" id="botonSalir"><span class="icono-menu">🚪</span>Cerrar sesión</a>
    </div>
  </div>

  <div class="contenido">

    <div class="encabezado">
      <div>
        <h1>Inventario</h1>
        <p class="subtitulo">Gestión de productos, existencias y precios</p>
      </div>
      <div class="encabezado__usuario">
        <div class="datos">
          <div class="nombre" id="nombreUsuarioTop">Usuario</div>
          <div class="fecha" id="fechaHoy"></div>
        </div>
        <div class="avatar" id="inicialUsuario">A</div>
      </div>
    </div>

    <div id="mensaje" class="mensaje oculto"></div>

    <!-- Resumen con color -->
    <div id="resumenInventario" style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px"></div>

    <!-- Buscador + filtro de categoría + botón nuevo -->
    <div class="filtros">
      <div class="buscador">
        <input type="text" id="busquedaProducto" placeholder="Buscar por nombre o código...">
      </div>
      <select id="filtroCategoria" style="width:auto">
        <option value="todas">Todas las categorías</option>
      </select>
      <button id="botonMostrarForm">+ Nuevo Producto</button>
    </div>

    <!-- Formulario, oculto hasta pulsar "+ Nuevo Producto" -->
    <div class="tarjeta oculto" id="formProducto" style="margin-bottom:20px">
      <h3 id="tituloFormulario">Nuevo producto</h3>
      <input type="hidden" id="idProducto">

      <div class="fila-formulario">
        <div class="campo">
          <label for="codigo">Código</label>
          <input type="text" id="codigo" placeholder="CER-010">
        </div>
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Cerveza Corona 330ml">
        </div>
        <div class="campo">
          <label for="categoria">Categoría</label>
          <input type="text" id="categoria" placeholder="Cervezas">
        </div>
      </div>

      <div class="fila-formulario">
        <div class="campo">
          <label for="precioCompra">Precio de compra</label>
          <input type="number" id="precioCompra" placeholder="2400">
        </div>
        <div class="campo">
          <label for="precioVenta">Precio de venta</label>
          <input type="number" id="precioVenta" placeholder="7500">
        </div>
        <div class="campo">
          <label for="stock">Existencias</label>
          <input type="number" id="stock" placeholder="24">
        </div>
      </div>

      <button id="botonGuardar">Guardar producto</button>
      <button id="botonCancelar" class="gris">Cancelar</button>
    </div>

    <div class="tabla-contenedor">
      <div class="tabla-scroll">
        <table>
          <thead>
            <tr>
              <th></th>
              <th>Código</th>
              <th>Nombre</th>
              <th>Categoría</th>
              <th class="derecha">Compra</th>
              <th class="derecha">Venta</th>
              <th class="derecha">Stock</th>
              <th class="centro">Acciones</th>
            </tr>
          </thead>
          <tbody id="cuerpoTabla"></tbody>
        </table>
      </div>
    </div>
    <p class="texto-xs texto-suave" id="conteoProductos" style="margin-top:10px"></p>

  </div>
</div>

<script src="js/lib/jquery-3.7.1.min.js"></script>
<script>
  if (typeof jQuery === "undefined") {
    document.write('<script src="https://code.jquery.com/jquery-3.7.1.min.js"><\/script>');
  }
</script>

<script src="js/core/config.js"></script>
<script src="js/core/sesion.js"></script>
<script src="js/modulos/productos.js"></script>

</body>
</html>
