<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión - El Cuate</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pantalla-login" data-publica="1">

  <img class="logo-login" src="img/logo-login.png" alt="Los Cuates de Patty">

  <form class="caja-login" id="formLogin" novalidate>

    <h1>El Quate</h1>
    <p class="subtitulo">Sistema POS</p>

    <div id="mensaje" class="mensaje oculto" role="alert"></div>

    <div class="campo">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" placeholder="usuario@correo.com" autocomplete="username" autofocus>
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button type="submit" id="botonEntrar">Entrar</button>

    <details style="margin-top:16px;font-size:12px;color:#ccc">
      <summary style="cursor:pointer">Conexión con el backend</summary>
      <div class="campo" style="margin:8px 0 6px">
        <label for="apiUrl" style="color:#ccc">URL del backend</label>
        <input type="text" id="apiUrl" placeholder="https://localhost:7135">
      </div>
      <button type="button" id="botonGuardarUrl" class="gris pequeno">Guardar URL</button>
    </details>

  </form>

  <script src="js/core/config.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/sesion.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/modulos/login.js"></script>

</body>
</html>
