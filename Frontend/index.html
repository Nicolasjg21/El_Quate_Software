<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar sesión - El Cuate</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pantalla-login">

  <img class="logo-login" src="img/logo-login.png" alt="Los Cuates de Patty">

  <div class="caja-login">

    <h1>El Cuate</h1>
    <p class="subtitulo">Sistema POS</p>

    <!-- Empieza oculto. JavaScript le quita la clase "oculto" si hay un error. -->
    <div id="mensaje" class="mensaje oculto"></div>

    <div class="campo">
      <label for="email">Usuario</label>
      <input type="text" id="email" placeholder="manager">
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>

    <button id="botonEntrar">Entrar</button>

  </div>

  <!-- jQuery: primero intenta la copia local; si no está, la trae de internet -->
  <script src="js/lib/jquery-3.7.1.min.js"></script>
  <script>
    if (typeof jQuery === "undefined") {
      document.write('<script src="https://code.jquery.com/jquery-3.7.1.min.js"><\/script>');
    }
  </script>

  <script src="js/core/config.js"></script>
  <script src="js/core/sesion.js"></script>
  <script src="js/modulos/login.js"></script>

</body>
</html>
