<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — El Cuate</title>
  <link rel="stylesheet" href="../css/login.css">
  <script src="../js/config.js"></script>
  <script src="../js/api-cliente.js"></script>
  <script src="../js/auth.js"></script>
</head>
<body>

  <main class="login-pantalla">

    <img
      src="../assets/logo-el-cuates.png"
      alt="Los Cuates de Patty"
      class="login-logo"
    >

    <section class="login-tarjeta">

      <h1 class="login-titulo">Bienvenido</h1>
      <p class="login-subtitulo">Accede a tu cuenta de El Cuate</p>

      <form class="login-formulario" id="form-login" method="post" novalidate>

        <div class="login-campo">
          <label for="usuario">Correo electrónico</label>
          <div class="login-input-wrap">
            <span class="login-icono" aria-hidden="true">&#9993;</span>
            <input type="email" id="usuario" placeholder="correo@ejemplo.com" maxlength="254" autocomplete="username" required>
          </div>
        </div>

        <div class="login-campo">
          <label for="password">Contraseña</label>
          <div class="login-input-wrap">
            <span class="login-icono" aria-hidden="true">&#128274;</span>
            <input type="password" id="password" placeholder="••••••••" maxlength="128" autocomplete="current-password" required>
          </div>
        </div>

        <label class="login-recordar">
          <input type="checkbox" id="recordar">
          Recordar este dispositivo
        </label>

        <p class="login-error" id="login-error" role="alert" hidden></p>

        <button type="submit" class="login-boton" id="btn-login">
          Acceder <span aria-hidden="true">&#8250;</span>
        </button>

      </form>

    </section>

    <p class="login-copyright">© 2024 El Cuate POS System. Todos los derechos reservados.</p>

  </main>

  <script src="../js/login.js"></script>
</body>
</html>
