<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mesas - El Cuate</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div class="contenedor">

  <div class="menu">
    <div class="marca-menu">
      <img src="img/logo-menu.png" alt="El Cuate">
      <div>
        <h2>El Cuate</h2>
        <p class="submarca">Sistema POS</p>
      </div>
    </div>
    <div class="menu__enlaces">
      <a href="inicio.html"><span class="icono-menu">🏠</span>Panel Principal</a>
      <a href="mesas.html" class="activo"><span class="icono-menu">🍽️</span>Mesas</a>
      <a href="reportes.html"><span class="icono-menu">📊</span>Ventas y Analíticas</a>
      <a href="productos.html"><span class="icono-menu">📦</span>Inventario</a>
      <a href="historiales.html"><span class="icono-menu">🧾</span>Historiales</a>
      <a href="auditoria.html"><span class="icono-menu">🕘</span>Auditoría</a>
      <a href="usuarios.html"><span class="icono-menu">👥</span>Usuarios</a>
    </div>
    <div class="menu__pie">
      <a href="configuracion.html"><span class="icono-menu">⚙️</span>Configuración</a>
      <a href="#" id="botonSalir"><span class="icono-menu">🚪</span>Cerrar sesión</a>
    </div>
  </div>

  <div class="contenido">

    <div class="encabezado">
      <div>
        <h1>Mesas</h1>
        <p class="subtitulo">Estado actual del salón</p>
      </div>
      <div class="encabezado__usuario">
        <div class="datos">
          <div class="nombre" id="nombreUsuarioTop">Usuario</div>
          <div class="fecha" id="fechaHoy"></div>
        </div>
        <div class="avatar" id="inicialUsuario">A</div>
      </div>
    </div>

    <div id="mensaje" class="mensaje oculto"></div>

    <!-- Resumen por estado, con color -->
    <div id="resumenMesas" style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px">
      <!-- lo llena JS -->
    </div>

    <!-- Filtros por estado -->
    <div class="filtros">
      <button class="chip activo" data-filtro="todas">Todas</button>
      <button class="chip" data-filtro="Libre">Libres</button>
      <button class="chip" data-filtro="Ocupada">Ocupadas</button>
      <button class="chip" data-filtro="Cerrando">Cerrando</button>
      <span style="flex:1"></span>
      <button id="botonNuevaMesa" style="padding:9px 18px">+ Nueva Mesa</button>
    </div>

    <!-- Formulario, oculto hasta que se pulse "+ Nueva Mesa" -->
    <div class="tarjeta oculto" id="formNuevaMesa" style="margin-bottom:20px">
      <h3>Registrar nueva mesa</h3>
      <div class="campo" style="max-width:220px">
        <label for="numeroMesa">Número de mesa</label>
        <input type="text" id="numeroMesa" placeholder="Ej: 12">
      </div>
      <button id="botonRegistrar">Registrar mesa</button>
      <button id="botonCancelarMesa" class="gris">Cancelar</button>
    </div>

    <!-- Rejilla de mesas -->
    <div class="rejilla-mesas" id="rejillaMesas"></div>

  </div>
</div>

<script src="js/lib/jquery-3.7.1.min.js"></script>
<script>
  if (typeof jQuery === "undefined") {
    document.write('<script src="https://code.jquery.com/jquery-3.7.1.min.js"><\/script>');
  }
</script>

<script src="js/core/config.js"></script>
<script src="js/core/sesion.js"></script>
<script src="js/modulos/mesas.js"></script>

</body>
</html>
