<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mesas - El Cuate</title>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body data-pagina="mesas" data-titulo="Mesas" data-subtitulo="Estado del salón y cuentas abiertas">
<div class="contenedor">
  <div class="menu" id="menu"></div>
  <div class="contenido">
    <div id="cabecera"></div>

    <div id="resumenMesas" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px"></div>
    <div class="filtros">
      <button class="chip activo" data-filtro="todas">Todas</button>
      <button class="chip" data-filtro="libre">Libres</button>
      <button class="chip" data-filtro="ocupada">Ocupadas</button>
      <span style="flex:1"></span>
      <button id="botonNuevaMesa">+ Nueva mesa</button>
    </div>
    <div class="tarjeta oculto" id="formNuevaMesa">
      <h3>Registrar nueva mesa</h3>
      <div class="fila-formulario">
        <div class="campo" style="max-width:220px"><label for="numeroMesa">Número de mesa</label>
          <input type="number" id="numeroMesa" min="1" step="1" placeholder="12"></div>
        <div class="campo" style="max-width:220px"><label for="estadoMesa">Estado</label>
          <select id="estadoMesa"></select></div>
      </div>
      <div class="acciones"><button id="botonRegistrar">Registrar mesa</button>
      <button id="botonCancelarMesa" class="gris">Cancelar</button></div>
    </div>
    <div class="rejilla-mesas" id="rejillaMesas"></div>
  </div>
</div>
<script src="../js/core/config.js"></script>
<script src="../js/core/ui.js"></script>
<script src="../js/core/sesion.js"></script>
<script src="../js/core/api.js"></script>
<script src="../js/core/datos.js"></script>
<script src="../js/core/layout.js"></script>
<script src="../js/modulos/mesas.js"></script>
</body>
</html>
