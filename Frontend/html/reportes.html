<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ventas y Analíticas - El Cuate</title>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body data-pagina="reportes" data-titulo="Ventas y Analíticas" data-subtitulo="Ingresos, métodos de pago y productos más vendidos">
<div class="contenedor">
  <div class="menu" id="menu"></div>
  <div class="contenido">
    <div id="cabecera"></div>

    <div class="filtros">
      <button class="chip" data-rango="hoy">Hoy</button>
      <button class="chip activo" data-rango="semana">Esta semana</button>
      <button class="chip" data-rango="mes">Este mes</button>
      <button class="chip" data-rango="todos">Todo</button>
      <span style="flex:1"></span>
      <button id="botonExportar" class="gris">Exportar CSV</button>
    </div>
    <div id="tarjetasKpi" style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px"></div>
    <div class="tarjeta" style="margin-bottom:20px"><h3>Ingresos vs costos de compra</h3>
      <div id="graficoIngresos" style="margin-top:12px"></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">
      <div class="tarjeta"><h3>Ingresos por categoría</h3><div id="graficoCategorias" style="margin-top:12px"></div></div>
      <div class="tarjeta"><h3>Métodos de pago</h3><div id="graficoPagos" style="margin-top:12px"></div></div>
    </div>
    <div class="tarjeta"><h3>Productos más vendidos</h3><div id="listaTop" style="margin-top:14px"></div></div>
  </div>
</div>
<script src="../js/core/config.js"></script>
<script src="../js/core/ui.js"></script>
<script src="../js/core/sesion.js"></script>
<script src="../js/core/api.js"></script>
<script src="../js/core/datos.js"></script>
<script src="../js/core/layout.js"></script>
<script src="../js/core/graficos.js"></script>
<script src="../js/modulos/reportes.js"></script>
</body>
</html>
