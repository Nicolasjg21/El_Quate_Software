<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogos - El Cuate</title>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body data-pagina="catalogos" data-titulo="Catálogos" data-subtitulo="Categorías, proveedores, métodos de pago, roles, permisos y tipos de documento">
<div class="contenedor">
  <div class="menu" id="menu"></div>
  <div class="contenido">
    <div id="cabecera"></div>

    <div class="pestanas" id="pestanasCatalogo"></div>
    <div class="filtros">
      <div class="buscador"><input type="text" id="busquedaCatalogo" placeholder="Buscar..."></div>
      <span style="flex:1"></span>
      <button id="botonMostrarForm">+ Nuevo</button>
    </div>
    <div class="tarjeta oculto" id="formCatalogo">
      <h3 id="tituloFormulario">Nuevo registro</h3>
      <input type="hidden" id="idRegistro">
      <div class="fila-formulario" id="camposCatalogo"></div>
      <div class="acciones"><button id="botonGuardar">Guardar</button>
      <button id="botonCancelar" class="gris">Cancelar</button></div>
    </div>
    <div class="tabla-contenedor"><div class="tabla-scroll"><table>
      <thead id="cabezaTabla"></thead><tbody id="cuerpoTabla"></tbody></table></div></div>
  </div>
</div>
<script src="../js/core/config.js"></script>
<script src="../js/core/ui.js"></script>
<script src="../js/core/sesion.js"></script>
<script src="../js/core/api.js"></script>
<script src="../js/core/datos.js"></script>
<script src="../js/core/layout.js"></script>
<script src="../js/modulos/catalogos.js"></script>
</body>
</html>
