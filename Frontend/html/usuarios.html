<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión de Usuarios - El Cuate</title>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body data-pagina="usuarios" data-titulo="Gestión de Usuarios" data-subtitulo="Cuentas con acceso al sistema">
<div class="contenedor">
  <div class="menu" id="menu"></div>
  <div class="contenido">
    <div id="cabecera"></div>

    <div class="filtros">
      <div class="buscador"><input type="text" id="busquedaUsuario" placeholder="Buscar por nombre, documento o correo..."></div>
      <select id="filtroRol" style="width:auto"><option value="todos">Todos los roles</option></select>
      <button id="botonMostrarForm">+ Nuevo usuario</button>
    </div>
    <div class="tarjeta oculto" id="formUsuario">
      <h3 id="tituloFormulario">Nuevo usuario</h3>
      <input type="hidden" id="idUsuario">
      <div class="fila-formulario">
        <div class="campo"><label for="nombres">Nombres *</label><input type="text" id="nombres" maxlength="100"></div>
        <div class="campo"><label for="apellidos">Apellidos *</label><input type="text" id="apellidos" maxlength="100"></div>
      </div>
      <div class="fila-formulario">
        <div class="campo"><label for="idTipoDocumento">Tipo de documento *</label><select id="idTipoDocumento"></select></div>
        <div class="campo"><label for="documento">Documento *</label><input type="text" id="documento" maxlength="20"></div>
        <div class="campo"><label for="telefono">Teléfono *</label><input type="text" id="telefono" maxlength="20"></div>
      </div>
      <div class="fila-formulario">
        <div class="campo"><label for="email">Correo electrónico *</label><input type="email" id="email" maxlength="150"></div>
        <div class="campo"><label for="idRol">Rol *</label><select id="idRol"></select></div>
        <div class="campo"><label for="password" id="etiquetaPassword">Contraseña *</label>
          <input type="password" id="password" autocomplete="new-password"></div>
        <div class="campo campo-check"><label for="estadoUsuario"><input type="checkbox" id="estadoUsuario" checked> Usuario activo</label></div>
      </div>
      <div class="acciones"><button id="botonGuardar">Guardar usuario</button>
      <button id="botonCancelar" class="gris">Cancelar</button></div>
    </div>
    <div class="tabla-contenedor"><div class="tabla-scroll"><table>
      <thead><tr><th>Nombre</th><th>Documento</th><th>Correo</th><th>Teléfono</th><th>Rol</th><th>Estado</th><th class="centro">Acciones</th></tr></thead>
      <tbody id="cuerpoTabla"></tbody></table></div></div>
    <p class="texto-xs texto-suave" id="conteoUsuarios" style="margin-top:10px"></p>
  </div>
</div>
<script src="../js/core/config.js"></script>
<script src="../js/core/ui.js"></script>
<script src="../js/core/sesion.js"></script>
<script src="../js/core/api.js"></script>
<script src="../js/core/datos.js"></script>
<script src="../js/core/layout.js"></script>
<script src="../js/modulos/usuarios.js"></script>
</body>
</html>
