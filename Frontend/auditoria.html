<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Auditoría - El Cuate</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div class="contenedor">

  <div class="menu">
    <div class="marca-menu">
      <img src="img/logo-menu.png" alt="El Cuate">
      <div>
        <h2>El Cuate</h2>
        <p class="submarca">Sistema POS</p>
      </div>
    </div>
    <div class="menu__enlaces">
      <a href="inicio.html"><span class="icono-menu">🏠</span>Panel Principal</a>
      <a href="mesas.html"><span class="icono-menu">🍽️</span>Mesas</a>
      <a href="reportes.html"><span class="icono-menu">📊</span>Ventas y Analíticas</a>
      <a href="productos.html"><span class="icono-menu">📦</span>Inventario</a>
      <a href="historiales.html"><span class="icono-menu">🧾</span>Historiales</a>
      <a href="auditoria.html" class="activo"><span class="icono-menu">🕘</span>Auditoría</a>
      <a href="usuarios.html"><span class="icono-menu">👥</span>Usuarios</a>
    </div>
    <div class="menu__pie">
      <a href="configuracion.html"><span class="icono-menu">⚙️</span>Configuración</a>
      <a href="#" id="botonSalir"><span class="icono-menu">🚪</span>Cerrar sesión</a>
    </div>
  </div>

  <div class="contenido">

    <div class="encabezado">
      <div>
        <h1>Auditoría</h1>
        <p class="subtitulo">Consulta y seguimiento de las actividades del sistema</p>
      </div>
      <div class="encabezado__usuario">
        <div class="datos">
          <div class="nombre" id="nombreUsuarioTop">Usuario</div>
          <div class="fecha" id="fechaHoy"></div>
        </div>
        <div class="avatar" id="inicialUsuario">A</div>
      </div>
    </div>

    <div id="mensaje" class="mensaje oculto"></div>

    <div class="tarjeta" style="margin-bottom:20px">
      <div class="fila-formulario">
        <div class="campo">
          <label for="filtroTexto">Buscar</label>
          <input type="text" id="filtroTexto" placeholder="Usuario, módulo o acción...">
        </div>
        <div class="campo">
          <label for="filtroModulo">Módulo</label>
          <select id="filtroModulo"><option value="Todas">Todas</option></select>
        </div>
        <div class="campo">
          <label for="filtroUsuario">Usuario</label>
          <select id="filtroUsuario"><option value="Todos">Todos</option></select>
        </div>
      </div>
      <div class="fila-formulario">
        <div class="campo">
          <label for="filtroDesde">Desde</label>
          <input type="date" id="filtroDesde">
        </div>
        <div class="campo">
          <label for="filtroHasta">Hasta</label>
          <input type="date" id="filtroHasta">
        </div>
      </div>
      <button id="botonFiltrar">Filtrar</button>
      <button id="botonLimpiar" class="gris">Limpiar</button>
    </div>

    <div class="tarjeta">
      <h3 id="conteoAuditoria">Registros de auditoría</h3>
      <div class="tabla-contenedor" style="margin-top:14px"><div class="tabla-scroll">
        <table>
          <thead>
            <tr><th>Fecha</th><th>Usuario</th><th>Módulo</th><th>Acción</th><th>Detalle</th></tr>
          </thead>
          <tbody id="cuerpoTabla"></tbody>
        </table>
      </div></div>
      <div class="paginacion">
        <span id="rangoPagina"></span>
        <div class="botones" id="botonesPagina"></div>
      </div>
    </div>

  </div>
</div>

<script src="js/lib/jquery-3.7.1.min.js"></script>
<script>
  if (typeof jQuery === "undefined") {
    document.write('<script src="https://code.jquery.com/jquery-3.7.1.min.js"><\/script>');
  }
</script>

<script src="js/core/config.js"></script>
<script src="js/core/sesion.js"></script>
<script src="js/modulos/auditoria.js"></script>

</body>
</html>
